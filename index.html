
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Plataforma de Gestión de Comisiones</title>
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    </head>

    <body>
      <div id="root">
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#64748B;">
          <p>Cargando plataforma...</p>
        </div>
      </div>
      <!-- Error handler: captura errores antes de que React monte -->
      <script>
        window.onerror = function(msg, url, line, col, error) {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;padding:2rem;text-align:center;">' +
              '<div style="max-width:600px;">' +
              '<h2 style="color:#EF4444;font-size:1.5rem;margin-bottom:1rem;">Error al cargar la aplicación</h2>' +
              '<p style="color:#64748B;margin-bottom:1rem;">' + (msg || 'Error desconocido') + '</p>' +
              '<p style="color:#94A3B8;font-size:0.875rem;">Archivo: ' + (url || 'desconocido') + ' Línea: ' + (line || '?') + '</p>' +
              '<button onclick="localStorage.removeItem(\'continental-comisiones\');window.location.reload();" style="margin-top:1rem;padding:0.75rem 1.5rem;background:#00184C;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:600;">Reiniciar datos y recargar</button>' +
              '</div></div>';
          }
          return false;
        };
      </script>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
